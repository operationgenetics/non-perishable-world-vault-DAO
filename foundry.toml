[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.ci]
fuzz = { runs = 10000, max_test_rejects = 100000 }
invariant = { runs = 1000, depth = 1000, max_failures = 1000 }

[profile.lint]
fuzz = { runs = 10, max_test_rejects = 100 }
invariant = { runs = 10, depth = 10, max_failures = 10 }

[test]
match_test = "test*"